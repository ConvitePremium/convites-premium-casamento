<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite Infinito</title><link rel="canonical" href="https://convitepremium.github.io/convites-premium-casamento/"><meta property="og:url" content="https://convitepremium.github.io/convites-premium-casamento/"><meta property="og:type" content="website"><meta property="og:title" content="Você recebeu um convite!"><meta property="og:description" content="Toque para abrir seu convite especial."><meta property="og:image" content="https://convitepremium.github.io/convites-premium-casamento/assets/preview.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><style>
*{box-sizing:border-box}body{margin:0;background:#181818;font:16px system-ui}#art{position:relative;width:100%;max-width:600px;margin:auto}#art img{width:100%;display:block}#demo{aspect-ratio:28/304.8;background:linear-gradient(#eee1ce,#bda68b,#eee1ce);text-align:center;padding-top:80px;color:#634d38} .zone{position:absolute;border:0;background:transparent;cursor:pointer;color:#493522;padding:0}.edit .zone{border:2px dashed #1679e8;background:#ffffff99;touch-action:none}.edit .zone:after{content:attr(data-label);font-size:12px}.edit .zone span{position:absolute;bottom:0;right:0;width:18px;height:18px;background:#1679e8;cursor:nwse-resize}#panel{position:fixed;top:0;right:0;width:min(340px,46vw);max-height:100dvh;overflow:auto;background:white;padding:12px;z-index:5;box-shadow:0 0 20px #0005}input,select,button{font:inherit}#panel input:not([type=checkbox]),#panel select{width:100%;margin:4px 0}button{cursor:pointer}#intro{position:fixed;inset:0;background:#111;z-index:10;display:grid;place-items:center}video{max-width:100%;max-height:100dvh}dialog{border:0;border-radius:18px;padding:25px;max-width:90vw;text-align:center}dialog button{padding:12px;margin:5px;border:0;border-radius:10px;background:#eee1ce}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:12px;border-radius:10px;z-index:20} [hidden]{display:none!important}
</style><body><div id="intro" hidden><img id="opening" src="assets/opening.webp" alt="Capa do convite" style="position:absolute;width:100%;height:100%;object-fit:contain"><video id="video" playsinline hidden></video><button id="start" style="position:absolute;bottom:12%">Abrir convite</button><button id="skip" style="position:absolute;top:15px;right:15px">Pular</button></div><main id="art"><img id="image" alt="Convite" hidden><div id="demo">Convite Infinito<br>Arte de teste</div></main><aside id="panel" hidden><b>Editor • Convite Infinito</b><p>Selecione um elemento, role a página e clique na arte para posicionar.</p><label>Arte local<input id="pickImage" type="file" accept="image/*"></label><label>Vídeo local<input id="pickVideo" type="file" accept="video/*"></label><label>Elemento<select id="sel"></select></label><label><input id="enabled" type="checkbox"> Ativado</label><button id="place">Posicionar na arte</button><div id="fields"></div><label>Nome do evento<input id="eventName"></label><label>WhatsApp (DDI + DDD)<input id="phone"></label><label>Data ISO com fuso<input id="date" placeholder="2027-01-30T19:00:00-03:00"></label><label>Chave Pix<input id="pix"></label><button id="save">Salvar neste navegador</button><button id="export">Exportar JSON</button><label>Importar JSON<input id="import" type="file" accept=".json"></label><button id="preview">Prévia / editor</button></aside><dialog id="rsvp"><h2>Confirmação de presença</h2><p>Você estará conosco?</p><button id="yes">Vou à festa</button><button id="no">Não vou à festa</button><button onclick="rsvp.close()">Voltar</button></dialog><div id="toast" hidden></div><script src="config.js"></script><script>
const $=id=>document.getElementById(id), edit=new URLSearchParams(location.search).has('editor'), labels={count:'Contagem regressiva',rsvp:'Confirmação',pix:'Copiar Pix',ceremony:'Cerimônia',reception:'Recepção',album:'Álbum'};
let c=structuredClone(window.INVITE), placing=false, preview=false, localVideo='';
if(edit){try{let s=localStorage.getItem('infinito:'+location.pathname);if(s)c=JSON.parse(s)}catch{} $('panel').hidden=false;document.body.classList.add('edit');}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2500)}
function media(){let im=$('image');im.onload=()=>{im.hidden=false;$('demo').hidden=true};im.onerror=()=>{im.hidden=true;$('demo').hidden=false};im.src=c.image;}
media();
function countdown(){let n=Math.max(0,Math.floor((Date.parse(c.date)-Date.now())/1000));return Number.isFinite(n)?[Math.floor(n/86400),Math.floor(n/3600)%24,Math.floor(n/60)%60,n%60].map(v=>String(v).padStart(2,'0')).join(' : '):'00 : 00 : 00 : 00'}
function action(k){if(k==='rsvp')$('rsvp').showModal();else if(k==='pix'){if(!c.pix)return toast('Pix não configurado');navigator.clipboard.writeText(c.pix).then(()=>toast('Chave Pix copiada!')).catch(()=>prompt('Copie a chave Pix:',c.pix))}else if(k!=='count'){let u=c.items[k].url;if(/^https?:\/\//i.test(u))window.open(u,'_blank','noopener');else toast('Link não configurado')}}
function render(){document.querySelectorAll('.zone').forEach(z=>z.remove());for(let [k,v] of Object.entries(c.items)){if(!v.enabled)continue;let z=document.createElement('button');z.className='zone';z.dataset.label=labels[k];z.setAttribute('aria-label',labels[k]);z.style.cssText=`left:${v.x}%;top:${v.y}%;width:${v.w}%;height:${v.h}%;`;if(k==='count'){z.textContent=countdown();z.style.fontSize=v.font+'px';z.id='counter'}if(edit&&!preview){let handle=document.createElement('span');z.append(handle);z.onpointerdown=e=>{if(placing)return;e.preventDefault();$('sel').value=k;sync();let resize=e.target===handle,rect=$('art').getBoundingClientRect(),sx=e.clientX,sy=e.clientY,old={...v};z.setPointerCapture(e.pointerId);z.onpointermove=a=>{let dx=(a.clientX-sx)/rect.width*100,dy=(a.clientY-sy)/rect.height*100;if(resize){v.w=Math.max(.5,Math.min(100-v.x,old.w+dx));v.h=Math.max(.1,Math.min(100-v.y,old.h+dy))}else{v.x=Math.max(0,Math.min(100-v.w,old.x+dx));v.y=Math.max(0,Math.min(100-v.h,old.y+dy))}Object.assign(z.style,{left:v.x+'%',top:v.y+'%',width:v.w+'%',height:v.h+'%'})};z.onpointerup=()=>{z.onpointermove=null;sync()}}}else z.onclick=()=>action(k);$('art').append(z)}}
setInterval(()=>{let z=$('counter');if(z&&z.firstChild)z.firstChild.nodeValue=countdown()},1000);
function sync(){let k=$('sel').value,v=c.items[k];$('enabled').checked=v.enabled;$('fields').replaceChildren();for(let key of ['x','y','w','h',...(k==='count'?['font']:['url'])]){if(key==='url'&&!['ceremony','reception','album'].includes(k))continue;let l=document.createElement('label');l.textContent=({x:'X (%)',y:'Y (%)',w:'Largura (%)',h:'Altura (%)',font:'Fonte (px)',url:'Link'})[key];let i=document.createElement('input');i.value=v[key]??'';i.onchange=()=>{if(key==='url')v[key]=i.value;else if(Number.isFinite(+i.value))v[key]=Math.max(0,+i.value);render()};l.append(i);$('fields').append(l)}}
if(edit){for(let k in labels)$('sel').add(new Option(labels[k],k));$('sel').onchange=sync;$('enabled').onchange=()=>{c.items[$('sel').value].enabled=$('enabled').checked;render()};$('place').onclick=()=>{placing=true;toast('Role e clique na posição desejada')};$('art').addEventListener('click',e=>{if(!placing)return;e.stopPropagation();let r=$('art').getBoundingClientRect(),v=c.items[$('sel').value];v.enabled=true;v.x=Math.max(0,Math.min(100-v.w,(e.clientX-r.left)/r.width*100));v.y=Math.max(0,Math.min(100-v.h,(e.clientY-r.top)/r.height*100));placing=false;sync();render()},true);function general(){for(let k of ['eventName','phone','date','pix']){$(k).value=c[k];$(k).oninput=()=>c[k]=$(k).value}}general();sync();$('pickImage').onchange=e=>{let f=e.target.files[0];if(f)$('image').src=URL.createObjectURL(f)};$('pickVideo').onchange=e=>{let f=e.target.files[0];if(f){localVideo=URL.createObjectURL(f);toast('Vídeo selecionado para teste')}};$('save').onclick=()=>{localStorage.setItem('infinito:'+location.pathname,JSON.stringify(c));toast('Configuração salva')};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,2)],{type:'application/json'}));a.download='config.json';a.click()};$('import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Object.keys(labels).every(k=>d.items?.[k]))throw Error();c=d;general();sync();render();media()}catch{toast('JSON inválido')}};$('preview').onclick=()=>{preview=!preview;document.body.classList.toggle('edit',!preview);render();if(preview&&localVideo)intro(localVideo)}}
function intro(src){let v=$('video');v.src=src;v.hidden=true;$('opening').hidden=false;$('start').hidden=false;$('intro').hidden=false;function finish(){v.pause();$('intro').hidden=true;window.scrollTo(0,0)}$('start').onclick=()=>{v.hidden=false;v.play().then(()=>{$('opening').hidden=true;$('start').hidden=true}).catch(()=>{v.hidden=true;toast('Vídeo indisponível');finish()})};v.onended=$('skip').onclick=finish;v.onerror=()=>{if(!$('start').hidden)return;finish()}}
function reply(yes){if(!c.phone)return toast('WhatsApp não configurado');let msg=(yes?'Vou à festa':'Não vou à festa')+(c.eventName?' — '+c.eventName:'');window.open('https://wa.me/'+c.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank','noopener');$('rsvp').close()}
$('yes').onclick=()=>reply(true);$('no').onclick=()=>reply(false);render();if(!edit&&c.video)intro(c.video);
</script></body></html>
